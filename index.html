<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>srtgen — アラビア語原稿 → SRT変換</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230f1115'/%3E%3Crect x='14' y='22' width='36' height='7' rx='3.5' fill='%234f8cff'/%3E%3Crect x='14' y='35' width='24' height='7' rx='3.5' fill='%23e8e9ec'/%3E%3C/svg%3E">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header>
  <h1>srtgen</h1>
  <p>アラビア語原稿を貼り付けると、Filmora読み込み用のSRT字幕ファイルを生成します</p>
</header>

<main id="mainView">
  <section class="pane" id="inputPane">
    <label class="field-label" for="manuscript">原稿テキスト</label>
    <textarea id="manuscript" dir="rtl" spellcheck="false" placeholder="ここにアラビア語の原稿を貼り付けてください..."></textarea>

    <div class="settings-row">
      <div class="field">
        <label class="field-label" for="cps">読み速度（cps）</label>
        <input type="number" id="cps" value="12" step="0.5" min="0.1">
      </div>
      <div class="field checkbox-field">
        <input type="checkbox" id="bom">
        <label class="field-label" for="bom" style="margin:0;">BOM付き出力</label>
      </div>
    </div>

    <button id="downloadBtn" disabled>SRTファイルをダウンロード</button>
    <button id="toTimelineBtn" class="secondary-btn" disabled>タイムラインで調整</button>
  </section>

  <section class="pane" id="previewPane">
    <div class="stats-bar">
      <div class="stat">
        <span class="stat-value" id="statCount">0</span>
        <span class="stat-label">総枚数</span>
      </div>
      <div class="stat">
        <span class="stat-value" id="statDuration">00:00.0</span>
        <span class="stat-label">総尺</span>
      </div>
    </div>
    <div id="emptyState">原稿を左に貼り付けると、分割結果がここにリアルタイムで表示されます。</div>
    <div id="previewList" style="display:none;"></div>
  </section>
</main>

<div id="editorView" style="display:none;">
  <div class="editor-header">
    <button id="playPauseBtn" class="editor-btn" title="スペース: 再生/停止">▶</button>
    <button id="upBtn" class="editor-btn" title="↑: 前のクリップへ">↑</button>
    <button id="downBtn" class="editor-btn" title="↓: 次のクリップへ">↓</button>
    <span class="editor-time" id="timeDisplay">0:00.0 / 0:00.0</span>
    <span class="editor-sep"></span>
    <button id="sBtn" class="editor-btn" title="S: ここで切る">S ここで切る</button>
    <button id="mBtn" class="editor-btn" title="M: 結合">M 結合</button>
    <button id="undoBtn" class="editor-btn" title="Ctrl+Z: 戻す">戻す（Undo）</button>
    <span class="editor-sep"></span>
    <div class="editor-cps">
      <label for="editorCps">cps</label>
      <input type="range" id="editorCps" min="8" max="18" step="0.5" value="12">
      <span id="editorCpsValue">12</span>
    </div>
    <span class="editor-sep"></span>
    <button id="backBtn" class="editor-btn secondary-btn">原稿に戻る</button>
    <button id="downloadEditorBtn" class="editor-btn primary-btn">SRTダウンロード</button>
    <div class="editor-hint" id="editorHint"></div>
  </div>

  <div class="preview-box" id="previewBox"></div>

  <div class="timeline-wrap" id="timelineWrap">
    <div class="timeline-inner" id="timelineInner">
      <div class="ruler" id="ruler"></div>
      <div class="clips-track" id="clipsTrack"></div>
      <div class="playhead" id="playhead"><div class="playhead-knob"></div></div>
    </div>
  </div>
</div>

<script src="app.js"></script>

</body>
</html>
