<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>srtgen — アラビア語原稿 → SRT変換</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230f1115'/%3E%3Crect x='14' y='22' width='36' height='7' rx='3.5' fill='%234f8cff'/%3E%3Crect x='14' y='35' width='24' height='7' rx='3.5' fill='%23e8e9ec'/%3E%3C/svg%3E">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header>
  <h1>srtgen</h1>
  <p>アラビア語原稿を貼り付けると、CapCut読み込み用のSRT字幕ファイルを生成します</p>
  <div id="restoreBanner" style="display:none;">
    <span>前回の続きを復元しました</span>
    <button id="newSessionBtn" type="button">新規作成</button>
  </div>
</header>

<main id="mainView">
  <section class="pane" id="inputPane">
    <label class="field-label" for="manuscript">原稿テキスト</label>
    <textarea id="manuscript" dir="rtl" spellcheck="false" placeholder="ここにアラビア語の原稿を貼り付けてください..."></textarea>

    <label class="field-label" for="translation">英訳（1行 = 1クリップ、改行のみで分割）</label>
    <textarea id="translation" class="translation-textarea" dir="ltr" spellcheck="false" placeholder="英訳を1行ずつ、アラビア語と同じ順番で入力してください..."></textarea>

    <div class="settings-row">
      <div class="field">
        <label class="field-label" for="cps">読み速度（cps）</label>
        <input type="number" id="cps" value="12" step="0.5" min="0.1">
      </div>
      <div class="field checkbox-field">
        <input type="checkbox" id="bom">
        <label class="field-label" for="bom" style="margin:0;">BOM付き出力</label>
      </div>
    </div>

    <button id="downloadBtn" disabled>SRTファイルをダウンロード</button>
    <button id="toTimelineBtn" class="secondary-btn" disabled>タイムラインで調整</button>
  </section>

  <section class="pane" id="previewPane">
    <div class="stats-bar">
      <div class="stat">
        <span class="stat-value" id="statCount">0</span>
        <span class="stat-label">総枚数</span>
      </div>
      <div class="stat">
        <span class="stat-value" id="statDuration">00:00.0</span>
        <span class="stat-label">総尺</span>
      </div>
    </div>
    <div id="alignmentWarning" class="alignment-warning" style="display:none;"></div>
    <div id="emptyState">原稿を左に貼り付けると、対応付け確認リストがここにリアルタイムで表示されます。</div>
    <div id="previewList" style="display:none;"></div>
  </section>
</main>

<div id="editorView" style="display:none;">
  <div class="editor-header">
    <button id="playPauseBtn" class="editor-btn" title="スペース: 再生/停止">▶</button>
    <button id="upBtn" class="editor-btn" title="↑: 前のクリップへ">↑</button>
    <button id="downBtn" class="editor-btn" title="↓: 次のクリップへ">↓</button>
    <button id="playbackRateBtn" class="editor-btn" title="L: 再生速度を切り替え">1x</button>
    <span class="editor-time" id="timeDisplay">0:00.0 / 0:00.0</span>
    <span class="editor-sep"></span>
    <button id="sBtn" class="editor-btn" title="S: ここで切る">S ここで切る</button>
    <button id="mBtn" class="editor-btn" title="M: 結合">M 結合</button>
    <button id="undoBtn" class="editor-btn" title="Ctrl+Z: 戻す">戻す（Undo）</button>
    <span class="editor-sep"></span>
    <div class="editor-cps">
      <label for="editorCps">cps</label>
      <input type="range" id="editorCps" min="8" max="18" step="0.5" value="12">
      <span id="editorCpsValue">12</span>
    </div>
    <span class="editor-sep"></span>
    <div class="timeline-json-control">
      <button id="saveTimelineJsonBtn" class="editor-btn" type="button">JSON保存</button>
      <button id="loadTimelineJsonBtn" class="editor-btn" type="button">JSON読み込み</button>
      <input type="file" id="timelineJsonFileInput" accept="application/json" style="display:none;">
    </div>
    <span class="editor-sep"></span>
    <button id="backBtn" class="editor-btn secondary-btn">原稿に戻る</button>
    <button id="downloadEditorBtn" class="editor-btn primary-btn">SRTダウンロード</button>
    <div class="editor-hint" id="editorHint"></div>
  </div>

  <div class="preview-stage" id="previewStage">
    <div class="preview-frame" id="previewFrame">
      <div class="safe-guide-box" id="previewSafeGuide"></div>
      <div class="subtitle-text" id="previewSubtitleText"></div>
    </div>
    <div class="preview-translation" id="previewTranslationText"></div>
    <div class="preview-judge" id="previewJudgeBadge"></div>
    <div class="preview-controls">
      <label>倍率(calibration)
        <input type="range" id="calibrationInput" min="0.80" max="1.30" step="0.01" value="1">
        <span id="calibrationValue">1.00</span>
      </label>
      <label>フォントサイズ
        <input type="number" id="fontSizeInput" min="10" step="1" value="55">
      </label>
    </div>
  </div>

  <div class="timeline-wrap" id="timelineWrap">
    <div class="timeline-inner" id="timelineInner">
      <div class="ruler" id="ruler"></div>
      <div class="track-row" id="subtitleTrackRow">
        <div class="clips-track" id="clipsTrack"></div>
      </div>
      <div class="playhead" id="playhead"><div class="playhead-knob"></div></div>
    </div>
  </div>
</div>

<div id="editModal" class="modal-overlay" style="display:none;">
  <div class="modal-box">
    <h2>クリップを編集</h2>
    <label class="field-label" for="modalArabicText">アラビア語本文</label>
    <textarea id="modalArabicText" dir="rtl" rows="3"></textarea>
    <label class="field-label" for="modalEnglishText">英訳</label>
    <input id="modalEnglishText" type="text" dir="ltr">
    <div class="modal-actions">
      <button id="modalAutoSplitBtn" type="button" class="editor-btn">自動で2行に分割</button>
      <button id="modalCollapseBtn" type="button" class="editor-btn">1行に戻す</button>
    </div>
    <p class="modal-note">この操作は尺(表示時間)を変更しません。</p>
    <div class="modal-preview-wrap">
      <div class="preview-frame small" id="modalPreviewFrame">
        <div class="safe-guide-box" id="modalSafeGuide"></div>
        <div class="subtitle-text" id="modalPreviewSubtitleText"></div>
      </div>
      <div class="modal-judge" id="modalJudgeBadge"></div>
    </div>
    <div class="modal-footer">
      <button id="modalCancelBtn" type="button" class="secondary-btn">キャンセル</button>
      <button id="modalSaveBtn" type="button" class="editor-btn primary-btn">保存</button>
    </div>
  </div>
</div>

<script type="module" src="src/app.js"></script>

</body>
</html>
